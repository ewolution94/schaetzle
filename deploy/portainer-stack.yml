# The Schätzle stack Portainer runs on the NAS.
#
# This is deliberately NOT the repo's docker-compose.yml. That one carries `build: .`,
# which would make Portainer compile the app on the NAS instead of pulling the image
# CI already published. Paste this into Portainer's stack editor (or point a
# Git-backed stack at this file), never that one.
#
# Auto-updates come from the shared Watchtower stack (clinch/deploy/watchtower-stack.yml),
# which only touches containers carrying the label below. With it, a push to `release`
# is the entire deploy. A deploy ends any game in progress (games live in memory).

services:
  schaetzle:
    image: ghcr.io/ewolution94/schaetzle:latest
    container_name: schaetzle
    restart: unless-stopped
    ports:
      # Change both numbers if 5800 is taken on the NAS.
      - "5800:5800"
    environment:
      - PORT=5800
      - TZ=Europe/Berlin
      # Live ebay.de listings. Both empty (the default) means the demo items. The values live
      # in Portainer's stack variables (Stack → Environment variables), never in this file.
      - EBAY_CLIENT_ID=${EBAY_CLIENT_ID:-}
      - EBAY_CLIENT_SECRET=${EBAY_CLIENT_SECRET:-}
      # Visit counts: /_e and /_e.js are forwarded to Census over the `ewolution` network.
      # Remove the line to stop counting; the page doesn't change either way.
      - SCHAETZLE_CENSUS=http://census:4901
    volumes:
      # Which collected listings came up lately, so games rotate across days (server/items/rotation.mjs).
      # Small; losing it only means games forget what they showed.
      - data:/data
    networks:
      # The shared network Census listens on. It must exist before this stack is created
      # (Portainer → Networks → `ewolution`).
      - ewolution
    labels:
      # The opt-in the shared Watchtower looks for (it runs with
      # WATCHTOWER_LABEL_ENABLE=true, so unlabelled containers are never touched).
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  data:

networks:
  ewolution:
    external: true
