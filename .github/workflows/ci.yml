name: CI

# Runs on pull requests, and is the gate docker-publish.yml calls before it publishes
# anything, so the checks guarding a PR and the checks guarding a deploy can't drift apart.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The built page and the game, served by the real production server, on the demo items
      # (SCHAETZLE_SOURCE=mock: CI never asks eBay).
      - name: Smoke test the production server
        run: |
          SCHAETZLE_SOURCE=mock PORT=5899 node server/server.mjs &
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:5899/healthz && break; sleep 0.5; done
          base=http://127.0.0.1:5899
          curl -sf $base/ | grep -q '<title>Schätzle</title>'
          curl -sf $base/KXPT | grep -q '<title>Schätzle</title>'
          curl -sf $base/KXPT/screen | grep -q '<title>Schätzle</title>'
          curl -sI $base/ | grep -qi "content-security-policy: default-src 'self'"
          curl -sI $base/ | grep -qi "cache-control: no-cache"
          curl -sf $base/manifest.webmanifest | grep -q '"name": "Schätzle"'
          curl -sf -o /dev/null $base/sw.js
          curl -sf -o /dev/null $base/og.png
          asset=$(curl -s $base/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -sI "$base$asset" | grep -qi 'cache-control: public, max-age=31536000, immutable'
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/assets/missing.js)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $base/)" = 405
          # The API never falls through to the page, and unknown photos are 404s.
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/api/nothing)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/img/unknown)" = 404
          curl -sf $base/api/config | grep -q '"demo":true'
          # A room, a second player, and the room's live stream.
          room=$(curl -sf -X POST -H 'content-type: application/json' --data '{"name":"CI"}' $base/api/rooms)
          code=$(echo "$room" | node -pe 'JSON.parse(require("fs").readFileSync(0)).code')
          token=$(echo "$room" | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          curl -sf -X POST -H 'content-type: application/json' --data '{"name":"Zwei"}' $base/api/rooms/$code/join | grep -q '"player"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -H "x-schaetzle-token: $token" --data '{}' $base/api/rooms/$code/start)" = 204
          curl -s -N --max-time 2 "$base/api/rooms/$code/events?p=x" | grep -q '"phase":"guess"'
          # A sorting game with teams deals four items a round, seen on the big screen's stream (no p).
          sorter=$(curl -sf -X POST -H 'content-type: application/json' --data '{"name":"CI"}' $base/api/rooms)
          scode=$(echo "$sorter" | node -pe 'JSON.parse(require("fs").readFileSync(0)).code')
          stoken=$(echo "$sorter" | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          curl -sf -X POST -H 'content-type: application/json' -H "x-schaetzle-token: $stoken" --data '{"mode":"sort","teams":2}' $base/api/rooms/$scode/settings
          curl -sf -X POST -H 'content-type: application/json' -H "x-schaetzle-token: $stoken" --data '{}' $base/api/rooms/$scode/start
          curl -s -N --max-time 2 "$base/api/rooms/$scode/events" | grep -q '"items":\[{'
          # The Census forwarder is wired in; without SCHAETZLE_CENSUS it answers locally.
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/_e.js)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST --data '{}' $base/_e)" = 204
          # Without Dashboard: its values block in the page with the built-in ones, and the manifest.
          curl -sf $base/ | grep -q '<script type="application/json" id="ewo-config">{"lang":"system","theme":"system"}</script>'
          curl -sf $base/KXPT | grep -q 'id="ewo-config"'
          curl -sf $base/ewo.config.json | grep -q '"app": "schaetzle"'

      # The server against a stand-in for Dashboard's apps' port: it takes the manifest, and the
      # family's dark theme and English reach the page.
      - name: Smoke test Dashboard's values
        run: |
          node --input-type=module -e "
            import http from 'node:http';
            http.createServer((req, res) => {
              if (req.method === 'PUT' && req.url === '/v1/manifest/schaetzle') { req.resume(); return res.writeHead(204).end(); }
              if (req.url === '/v1/config/schaetzle') return res.writeHead(200, { 'content-type': 'application/json', etag: '\"1\"' }).end(JSON.stringify({ family: { theme: 'dark', lang: 'en' }, app: {} }));
              res.writeHead(404).end();
            }).listen(5898);
          " &
          DASHBOARD_URL=http://127.0.0.1:5898 SCHAETZLE_SOURCE=mock PORT=5897 node server/server.mjs &
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:5897/healthz && break; sleep 0.5; done
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:5897/ | grep -q '"theme":"dark"' && break; sleep 0.5; done
          curl -sf http://127.0.0.1:5897/ | grep -q '{"lang":"en","theme":"dark"}'
