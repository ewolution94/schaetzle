# For trying the image locally (it builds from source). The NAS runs deploy/portainer-stack.yml.
services:
  schaetzle:
    build: .
    image: ghcr.io/ewolution94/schaetzle:latest
    container_name: schaetzle
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Leave both empty for the demo items; set both for live ebay.de listings.
      - EBAY_CLIENT_ID=${EBAY_CLIENT_ID:-}
      - EBAY_CLIENT_SECRET=${EBAY_CLIENT_SECRET:-}
